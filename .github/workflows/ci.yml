name: Project CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project-ci:
    name: project-ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.18.0"

      - name: Install npm dependencies
        shell: bash
        run: |
          set -euo pipefail
          declare -A installed=()
          while IFS= read -r -d '' lockfile; do
            directory="$(dirname "$lockfile")"
            if [ -n "${installed[$directory]:-}" ]; then
              continue
            fi
            installed["$directory"]=1
            npm ci --prefix "$directory"
          done < <(
            find . -type f \
              \( -name package-lock.json -o -name npm-shrinkwrap.json \) \
              -not -path './.git/*' \
              -not -path '*/node_modules/*' \
              -print0
          )

      - name: Run project checks
        run: node scripts/run-project-checks.mjs
