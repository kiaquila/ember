name: Web Design Update

on:
  workflow_dispatch:
    inputs:
      version:
        description: Immutable web-design release version
        required: true
        type: string
      source_sha:
        description: Full 40-character release commit SHA
        required: true
        type: string
      accept_ownership_change:
        description: Explicitly accept added or revoked managed paths
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  update:
    name: prepare-update-pr
    outputs:
      head_sha: ${{ steps.open.outputs.head_sha }}
      pr_number: ${{ steps.open.outputs.pr_number }}
    # A manual run can select any ref, and that ref supplies this file. Holding
    # the write token only on the default branch keeps a pushed branch from
    # dispatching a rewritten copy of this workflow against the repository.
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      actions: write
      contents: write
      pull-requests: write
    # The condition above cannot enforce itself: a manual run picks a ref and
    # GitHub loads that ref's copy of this file, so a branch could delete it.
    # An environment is decided by GitHub rather than by this file, so restrict
    # this environment's deployment branches to the default branch — see
    # docs/operations/github-setup.md.
    environment: web-design-update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Validate immutable inputs
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.18.0"

      - name: Apply allowlisted baseline bytes
        env:
          ACCEPT_OWNERSHIP_CHANGE: ${{ inputs.accept_ownership_change }}
          GH_TOKEN: ${{ secrets.WEB_DESIGN_READ_TOKEN || github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          args=(
            apply
            --repo kiaquila/web-design
            --source-ref "$SOURCE_SHA"
            --version "$VERSION"
          )
          if [ "$ACCEPT_OWNERSHIP_CHANGE" = "true" ]; then
            args+=(--accept-ownership-change)
          fi
          node scripts/sync-project.mjs "${args[@]}"

      - name: Open update pull request
        id: open
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && [ -z "$(git status --short)" ]; then
            echo "Baseline is already current."
            exit 0
          fi
          # A manual retry starts from the default branch again and creates a
          # new commit. Include both run identifiers so that neither a new
          # dispatch nor a rerun collides with an earlier remote branch.
          branch="chore/web-design-${VERSION//./-}-${RUN_ID}-${RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -A
          git commit -m "chore: update web-design baseline to $VERSION" \
            -m "Source: kiaquila/web-design@$SOURCE_SHA" \
            -m "Co-authored-by: OpenAI Codex <codex@openai.com>"
          git push --set-upstream origin "$branch"
          body="$(printf '%s\n\n%s\n\n%s' \
            "Updates managed governance files to web-design $VERSION." \
            "Source commit: $SOURCE_SHA" \
            "Co-authored-by: Codex <codex@openai.com>")"
          pr_url="$(gh pr create --base "${{ github.event.repository.default_branch }}" \
            --head "$branch" \
            --title "chore: update web-design baseline to $VERSION" \
            --body "$body")"
          head_sha="$(git rev-parse HEAD)"
          pr_number="${pr_url##*/}"
          [[ "$pr_number" =~ ^[1-9][0-9]*$ ]]
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

          # GITHUB_TOKEN-created pull-request workflows stay approval-gated, so
          # candidate workflow bytes never execute automatically. The jobs
          # below validate this exact head from the already trusted workflow
          # run, and the existing trusted Codex dispatch publishes its own
          # head-bound result.
          gh workflow run codex-review.yml \
            --ref "${{ github.event.repository.default_branch }}" \
            -f pr_number="$pr_number" \
            -f head_sha="$head_sha"

  project-ci:
    name: validate-update-project-ci
    needs: update
    if: needs.update.outputs.head_sha != ''
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout proposed update
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.update.outputs.head_sha }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.18.0"

      - name: Install npm dependencies
        shell: bash
        run: |
          set -euo pipefail
          declare -A installed=()
          while IFS= read -r -d '' lockfile; do
            directory="$(dirname "$lockfile")"
            if [ -n "${installed[$directory]:-}" ]; then
              continue
            fi
            installed["$directory"]=1
            npm ci --prefix "$directory"
          done < <(
            find . -type f \
              \( -name package-lock.json -o -name npm-shrinkwrap.json \) \
              -not -path './.git/*' \
              -not -path '*/node_modules/*' \
              -print0
          )

      - name: Run project checks
        run: node scripts/run-project-checks.mjs

  repository-guard:
    name: validate-update-repository-guard
    needs: update
    if: needs.update.outputs.head_sha != ''
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout proposed update
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.update.outputs.head_sha }}
          fetch-depth: 0

      - name: Checkout trusted policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
          path: .guard-trusted
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.18.0"

      - name: Install proposed and trusted policy dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --prefix .web-design/policy
          npm ci --ignore-scripts --prefix .guard-trusted/.web-design/policy

      - name: Run trusted repository policy
        run: node .guard-trusted/scripts/check-repository.mjs --root "$GITHUB_WORKSPACE"

      - name: Check managed baseline drift
        run: node .guard-trusted/scripts/check-managed-files.mjs "$GITHUB_WORKSPACE"

      - name: Test baseline policy and updater
        run: node scripts/test-web-design.mjs

  osv-scan:
    name: validate-update-osv-scan
    needs: update
    if: needs.update.outputs.head_sha != ''
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout proposed update
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.update.outputs.head_sha }}

      - name: Scan dependencies
        uses: google/osv-scanner-action/osv-scanner-action@8deb546fdb875b9996d27d4950be7312dac076a1 # v2.5.0
        with:
          scan-args: |-
            --recursive
            .

  publish-update-checks:
    name: publish-update-checks
    needs: [update, project-ci, repository-guard, osv-scan]
    if: |
      always() &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      needs.update.result == 'success' &&
      needs.update.outputs.head_sha != ''
    environment: web-design-update
    permissions:
      checks: write
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted check publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.18.0"

      - name: Publish head-bound validation results
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UPDATE_BASELINE_SOURCE_CONCLUSION: success
          UPDATE_CHECK_DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          UPDATE_CHECK_HEAD_SHA: ${{ needs.update.outputs.head_sha }}
          UPDATE_CHECK_PR_NUMBER: ${{ needs.update.outputs.pr_number }}
          UPDATE_OSV_SCAN_CONCLUSION: ${{ needs.osv-scan.result == 'success' && 'success' || 'failure' }}
          UPDATE_PROJECT_CI_CONCLUSION: ${{ needs.project-ci.result == 'success' && 'success' || 'failure' }}
          UPDATE_REPOSITORY_GUARD_CONCLUSION: ${{ needs.repository-guard.result == 'success' && 'success' || 'failure' }}
        run: node scripts/publish-update-checks.mjs
