name: Repository Guard

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-guard:
    name: repository-guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout proposed repository state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.18.0"

      - name: Checkout trusted policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .guard-trusted
          fetch-depth: 1

      - name: Install proposed and trusted policy dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --prefix .web-design/policy
          if [ -f .guard-trusted/.web-design/policy/package-lock.json ]; then
            npm ci --ignore-scripts --prefix .guard-trusted/.web-design/policy
          fi

      - name: Run trusted repository policy
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .guard-trusted/.web-design/project.json ] && \
             [ -f .guard-trusted/scripts/check-repository.mjs ]; then
            node .guard-trusted/scripts/check-repository.mjs --root "$GITHUB_WORKSPACE"
          else
            echo "::warning::Template-v2 policy is not on the default branch yet; using the bootstrap copy."
            node scripts/check-repository.mjs --root "$GITHUB_WORKSPACE"
          fi

      - name: Check managed baseline drift
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .guard-trusted/.web-design/project.json ] && \
             [ -f .guard-trusted/scripts/check-managed-files.mjs ]; then
            node .guard-trusted/scripts/check-managed-files.mjs "$GITHUB_WORKSPACE"
          else
            echo "::warning::Managed baseline policy is not on the default branch yet; using the bootstrap copy."
            node scripts/check-managed-files.mjs
          fi

      - name: Test baseline policy and updater
        run: node scripts/test-web-design.mjs
