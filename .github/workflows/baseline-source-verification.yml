name: Baseline Source Verification

on:
  workflow_run:
    workflows:
      - Repository Guard
    types:
      - completed

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  verify:
    name: publish-baseline-source-verification
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0] != null &&
      github.event.workflow_run.pull_requests[1] == null
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted default-branch policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Checkout proposed pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: .baseline-proposed
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.18.0"

      - name: Install trusted policy dependencies
        run: npm ci --ignore-scripts --prefix .web-design/policy

      - name: Validate with trusted policy and publish the head-bound check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_TOKEN: ${{ secrets.WEB_DESIGN_READ_TOKEN || github.token }}
        shell: bash
        # This job holds write permissions beside the isolated untrusted
        # checkout, so the guard refuses actor-controlled expressions in its
        # environment and free-form shell that touches the step environment
        # files. The managed, hash-locked script reads the event payload from
        # $GITHUB_EVENT_PATH, performs the repository-identity and run-SHA
        # checks, publishes the check run, and fails the job on a bad result.
        run: node scripts/verify-baseline-source.mjs
