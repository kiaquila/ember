name: Codex Review Rerun

on:
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created, edited]

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  codex-review-rerun:
    name: codex-review-rerun
    if: |
      (
        github.event_name == 'pull_request_review' &&
        github.event.review.user.login == 'chatgpt-codex-connector[bot]'
      ) ||
      (
        github.event.issue.pull_request &&
        github.event.comment.user.login == 'chatgpt-codex-connector[bot]' &&
        startsWith(github.event.comment.body, 'Codex Review:')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted rerun policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.18.0"

      - name: Rerun gate for trusted Codex evidence
        # Written without `;` so every word stands on its own, and without a
        # quoted message so no word is a blob: this job is write-capable on an
        # actor-triggered event, where the guard reads the shell word by word.
        # The echoed token means the Codex Review bootstrap is not installed on
        # the default branch yet, which the pull-request gate handles on the
        # installation PR itself.
        run: |
          if [ -f scripts/codex-review-rerun.mjs ]
          then
            node scripts/codex-review-rerun.mjs
          else
            echo codex-review-bootstrap-not-installed
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}
